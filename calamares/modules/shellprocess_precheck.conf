# Runs before anything touches the disk.
#
# Everything this install needs that could be absent is checked here, while the
# machine is still exactly as the user left it. A failure at this point costs
# them nothing; the same failure four steps later costs them their disk, since
# by then it has been repartitioned and the install cannot finish.
---
dontChroot: true
timeout: 60
script:
    - "/usr/local/lib/starch/copy-kernel --check"
