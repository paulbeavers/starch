# starch — Calamares sequence.
#
# The install copies the live filesystem onto the target (unpackfs) and then
# turns that copy into a normal Arch system: its own machine-id, its own fstab,
# its own initramfs built with the ordinary hooks rather than archiso's, and a
# bootloader. The last shellprocess removes the parts that only made sense on
# install media.
---
modules-search: [ local ]

instances:
- id:      precheck
  module:  shellprocess
  config:  shellprocess_precheck.conf
- id:      kernel
  module:  shellprocess
  config:  shellprocess_kernel.conf
- id:      ucode
  module:  shellprocess
  config:  shellprocess_ucode.conf
- id:      plymouth
  module:  shellprocess
  config:  shellprocess_plymouth.conf
- id:      splashcmd
  module:  shellprocess
  config:  shellprocess_splashcmd.conf
- id:      strip
  module:  shellprocess
  config:  shellprocess_strip.conf
- id:      desktop
  module:  shellprocess
  config:  shellprocess_desktop.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  # Before the partitioner, deliberately: this is the last moment at which
  # failing costs the user nothing.
  - shellprocess@precheck
  - partition
  - mount
  - unpackfs
  - shellprocess@kernel
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  # networkcfg is deliberately absent. It copies the live session's
  # NetworkManager profiles into the target and rewrites their permissions=
  # line from the live user to the new one — so the installed machine runs a
  # profile created on a different system, for a different user, edited by a
  # script. A 2013 15" MacBook Pro came up with an address, a valid /24 lease
  # and no routes at all from one of these; connecting fresh takes seconds and
  # produces a profile NetworkManager made for the machine it is on.
  #
  # The cost is that a machine installed over wifi has no network on first
  # boot until you reconnect. nm-applet is in the tray for exactly that.
  - hwclock
  - shellprocess@strip
  - initcpiocfg
  - shellprocess@ucode
  - shellprocess@plymouth
  - initcpio
  - bootloader
  - shellprocess@splashcmd
  - services-systemd
  - shellprocess@desktop
  - umount
- show:
  - finished

branding: starch

# Nothing here should prompt for a password: the live session is already root.
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
