# Acts on the checkbox in packagechooser@sshd.
#
# contextualprocess compares a global storage value against strings and runs
# the matching command. packagechooser with method: legacy stores the selected
# ids joined by commas, so with a single item the value is either "sshd" or
# empty — and the empty case deliberately runs nothing, because strip-live has
# already disabled the unit and that is the default we want.
---
dontChroot: false
timeout: 60

packagechooser_sshd:
    "sshd": "/usr/local/lib/starch/enable-sshd"
    "": ""
