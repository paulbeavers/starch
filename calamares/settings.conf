# starch — Calamares sequence.
#
# The install copies the live filesystem onto the target (unpackfs) and then
# turns that copy into a normal Arch system: its own machine-id, its own fstab,
# its own initramfs built with the ordinary hooks rather than archiso's, and a
# bootloader. The last shellprocess removes the parts that only made sense on
# install media.
---
modules-search: [ local ]

instances:
- id:      kernel
  module:  shellprocess
  config:  shellprocess_kernel.conf
- id:      strip
  module:  shellprocess
  config:  shellprocess_strip.conf
- id:      desktop
  module:  shellprocess
  config:  shellprocess_desktop.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - shellprocess@kernel
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@strip
  - initcpiocfg
  - initcpio
  - bootloader
  - services-systemd
  - shellprocess@desktop
  - umount
- show:
  - finished

branding: starch

# Nothing here should prompt for a password: the live session is already root.
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
