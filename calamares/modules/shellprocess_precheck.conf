# Runs before anything touches the disk.
#
# Everything this install needs that could be absent is checked here, while the
# machine is still exactly as the user left it. A failure at this point costs
# them nothing; the same failure four steps later costs them their disk, since
# by then it has been repartitioned and the install cannot finish. That is not
# hypothetical — it is how this check came to exist.
#
# The live system is checked rather than the target, which does not exist yet.
# It carries the same kernel the target will receive, because the target is a
# copy of it.
---
dontChroot: true
timeout: 60
script:
    - "/usr/local/lib/starch/copy-kernel --check /"
