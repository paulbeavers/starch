# The one install-time option starch offers.
#
# packagechooser is really a package selector, but with method: legacy it does
# nothing except write the chosen ids to global storage — no packages are
# installed, no lists are touched. That makes it a checkbox, which is all this
# needs: openssh is already on the disk, copied with the rest of the
# filesystem, and only the unit is off.
#
# The instance id decides the global storage key, so this file being
# packagechooser@sshd is what makes it packagechooser_sshd. contextualprocess
# watches for that.
---
mode: optionalmultiple
method: legacy

labels:
    step: "Options"

items:
    - id: sshd
      name: "Enable SSHD"
      description: "Allow remote logins over SSH from the first boot. Off by
        default: a desktop that comes up listening on the network is a choice
        worth making deliberately rather than inheriting. You can turn it on
        later with: sudo systemctl enable --now sshd"
