# Copy the live filesystem onto the target.
#
# The source is the squashfs archiso has already mounted read-only at
# /run/archiso/airootfs — the same image the live session is running from, so
# what gets installed is exactly what was tested, without the changes the live
# session has made to its own overlay on top.
#
# sourcefs is "file", not "squashfs", because the source is that mount point
# rather than the .sfs itself. A "squashfs" entry runs `unsquashfs -l` on the
# source to count files, which fails on a directory; a "file" entry is not
# mounted at all and is handed straight to rsync. Pointing at the .sfs under
# /run/archiso/bootmnt would work too, but that path contains the profile's
# install_dir and would break if it were ever renamed.
---
unpack:
    - source: /run/archiso/airootfs
      sourcefs: file
      destination: ""
